name = indianNumberReader
summary = "Indian Number Reader (lakh/crore)"
description = """Reads large numbers in the Indian numbering system (lakh and crore) instead of million and billion, in any application: Excel, Tally, bank statements, PDFs, web pages. For example 1,500,000 is read as 15 lakh and 12,34,56,789 as 12 crore 34 lakh 56789.
Commands:
NVDA+Alt+N: turn automatic Indian number reading on or off.
NVDA+Alt+I: read the selected text, or the current line or cell, in lakh and crore. Press twice quickly to copy it to the clipboard with Indian commas (15,00,000).
Settings: NVDA menu, Preferences, Settings, Indian Number Reader. Commands can be changed in Input Gestures under the Indian Number Reader category."""
author = "Mukesh Jain, VisionAccess"
version = 1.0.0
docFileName = readme.html
minimumNVDAVersion = 2023.1.0
lastTestedNVDAVersion = 2026.2.0
